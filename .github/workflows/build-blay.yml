name: Build BLAY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -e

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --version

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Checking Android SDK..."

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo "Android SDK Platform 35: OK"
          echo "Android Build Tools 35.0.0: OK"
          echo "Android Platform Tools: OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          echo "Checking project structure..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure: OK"

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Build BLAY Debug APK
        shell: bash
        run: |
          set -e

          echo "Starting BLAY APK build..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Checking generated APK..."

          ls -lah app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully generated:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload BLAY APK
        uses: actions/upload-artifact@v4
        with:
          name: BLAY-v1.8-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
