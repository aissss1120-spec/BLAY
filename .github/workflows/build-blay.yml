name: Build BLAY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ========================================
      # 1. CHECKOUT REPOSITORY
      # ========================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ========================================
      # 2. JAVA 17
      # ========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================
      # 3. ANDROID SDK
      # ========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo "Android SDK OK"


      # ========================================
      # 4. ANDROID PATH
      # ========================================
      - name: Configure Android PATH
        shell: bash
        run: |
          set -e

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi

          echo "Android PATH configured"


      # ========================================
      # 5. EXTRACT BLAY SOURCE
      # ========================================
      - name: Extract BLAY source
        shell: bash
        run: |
          set -e

          echo "Checking BLAY archive..."

          test -f BLAY-v1.8-clean.zip

          mkdir -p .blay-source

          unzip -q BLAY-v1.8-clean.zip -d .blay-source

          echo ""
          echo "Archive contents:"
          find .blay-source -maxdepth 4 -type f | sort

          echo ""
          echo "Finding Android Gradle project..."

          SETTINGS_FILE=$(find .blay-source \
            -name "settings.gradle.kts" \
            -type f \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan di ZIP."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Copying BLAY source..."

          cp -a "$PROJECT_ROOT"/. .

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort


      # ========================================
      # 6. CHECK ANDROID PROJECT
      # ========================================
      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          echo "Checking BLAY Android project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "BLAY project structure:"
          echo "OK: settings.gradle.kts"
          echo "OK: build.gradle.kts"
          echo "OK: gradle.properties"
          echo "OK: app/build.gradle.kts"
          echo "OK: AndroidManifest.xml"


      # ========================================
      # 7. SETUP GRADLE
      # ========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ========================================
      # 8. GRADLE VERSION
      # ========================================
      - name: Show Gradle version
        shell: bash
        run: |
          gradle --version


      # ========================================
      # 9. BUILD BLAY APK
      # ========================================
      - name: Build BLAY Debug APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "       BUILDING BLAY DEBUG APK"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "========================================"
          echo "       BLAY BUILD FINISHED"
          echo "========================================"


      # ========================================
      # 10. VERIFY APK
      # ========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            echo ""
            echo "APK directory:"
            find app/build -type f 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "       APK BERHASIL DIBUAT"
          echo "========================================"

          ls -lh "$APK"


      # ========================================
      # 11. UPLOAD APK
      # ========================================
      - name: Upload BLAY APK
        uses: actions/upload-artifact@v4
        with:
          name: BLAY-v1.8-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
