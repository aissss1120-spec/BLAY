name: Build BLAY 2.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build BLAY 2.2 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare BLAY source
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "MENCARI PROJECT BLAY 2.2"
          echo "================================"

          if [ -f "settings.gradle.kts" ] && \
             [ -f "app/build.gradle.kts" ]; then

            echo "Project ditemukan di root."

          else

            ZIP=$(find . -maxdepth 2 -type f \
              \( -name "*.zip" -o -name "*.ZIP" \) \
              | grep -Ei "BLAY|blay" \
              | head -n 1 || true)

            if [ -z "$ZIP" ]; then
              echo "ERROR: ZIP BLAY tidak ditemukan."
              echo ""
              echo "Isi repository:"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            echo "ZIP ditemukan:"
            echo "$ZIP"

            rm -rf .blay-source
            mkdir -p .blay-source

            unzip -q "$ZIP" -d .blay-source

            SETTINGS=$(find .blay-source \
              -type f \
              -name "settings.gradle.kts" \
              -print -quit)

            if [ -z "$SETTINGS" ]; then
              SETTINGS=$(find .blay-source \
                -type f \
                -name "settings.gradle" \
                -print -quit)
            fi

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle tidak ditemukan."
              find .blay-source -type f | sort
              exit 1
            fi

            PROJECT_ROOT=$(dirname "$SETTINGS")

            echo "Project root:"
            echo "$PROJECT_ROOT"

            cp -a "$PROJECT_ROOT"/. .

          fi

          echo ""
          echo "================================"
          echo "SOURCE BLAY SIAP"
          echo "================================"

          find app/src/main -type f | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Memeriksa project BLAY..."

          test -f "settings.gradle.kts" \
            || test -f "settings.gradle"

          test -f "build.gradle.kts" \
            || test -f "build.gradle"

          test -f "app/build.gradle.kts" \
            || test -f "app/build.gradle"

          test -f "app/src/main/AndroidManifest.xml"

          test -f "app/src/main/java/com/blay/assistant/MainActivity.java"

          test -f "app/src/main/java/com/blay/assistant/BlayStandbyService.java"

          echo ""
          echo "BLAY 2.2 PROJECT OK"

      - name: Show Gradle
        shell: bash
        run: |
          gradle --version

      - name: Clean
        shell: bash
        run: |
          set -e
          gradle clean --no-daemon --stacktrace

      - name: Build BLAY 2.2
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "       BUILD BLAY 2.2 DEBUG APK"
          echo "========================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"

            find app/build \
              -type f \
              | sort

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "       BLAY 2.2 BERHASIL DIBUILD"
          echo "========================================"

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload BLAY 2.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: BLAY-2.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
