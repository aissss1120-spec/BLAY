name: Build BLAY 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build BLAY APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo "Android SDK OK"


      # ==========================================
      # ANDROID PATH
      # ==========================================
      - name: Configure Android PATH
        shell: bash
        run: |
          set -e

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android PATH configured"


      # ==========================================
      # PREPARE BLAY SOURCE
      # ==========================================
      - name: Prepare BLAY 2.0 source
        shell: bash
        run: |
          set -e

          echo "Preparing BLAY source..."

          # Jika project Android sudah langsung ada di repository,
          # gunakan langsung.
          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "BLAY Android project ditemukan langsung di repository."
            exit 0
          fi

          # Jika source masih berupa ZIP, ekstrak.
          ZIP="BLAY-2.0-complete.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP tidak ditemukan."
            echo ""
            echo "File repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP"

          rm -rf .blay-source
          mkdir -p .blay-source

          unzip -q "$ZIP" -d .blay-source

          echo ""
          echo "Isi ZIP:"
          find .blay-source -maxdepth 4 -type f | sort

          SETTINGS_FILE=$(find .blay-source \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "BLAY project root:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. .

          echo ""
          echo "BLAY source berhasil disiapkan."


      # ==========================================
      # VERIFY PROJECT
      # ==========================================
      - name: Verify BLAY Android project
        shell: bash
        run: |
          set -e

          echo "Checking BLAY project..."

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "gradle.properties"
          test -f "app/build.gradle.kts"
          test -f "app/src/main/AndroidManifest.xml"

          echo ""
          echo "Required files:"
          echo "OK  settings.gradle.kts"
          echo "OK  build.gradle.kts"
          echo "OK  gradle.properties"
          echo "OK  app/build.gradle.kts"
          echo "OK  AndroidManifest.xml"

          echo ""
          echo "Android source:"
          find app/src/main -type f | sort


      # ==========================================
      # SETUP GRADLE
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==========================================
      # CHECK GRADLE
      # ==========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          gradle --version


      # ==========================================
      # BUILD BLAY
      # ==========================================
      - name: Build BLAY Debug APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "       BUILDING BLAY 2.0 DEBUG APK"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "=========================================="
          echo "       BLAY 2.0 BUILD SELESAI"
          echo "=========================================="


      # ==========================================
      # VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            echo ""
            echo "Build output:"
            find app/build -type f 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       APK BLAY 2.0 BERHASIL"
          echo "=========================================="

          ls -lh "$APK"


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload BLAY 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: BLAY-2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
