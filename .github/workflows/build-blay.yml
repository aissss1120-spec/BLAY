name: Build BLAY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4


      # =========================
      # JAVA 17
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================
      # ANDROID SDK
      # =========================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Checking Android SDK..."
          test -d "$ANDROID_HOME"

          echo "Android SDK directory:"
          ls -lah "$ANDROID_HOME"

          echo "Checking Android platform 35..."
          test -d "$ANDROID_HOME/platforms/android-35"

          echo "Checking Android Build Tools..."
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Checking platform-tools..."
          test -d "$ANDROID_HOME/platform-tools"

          echo "Android SDK OK"


      # =========================
      # SDK PATH
      # =========================
      - name: Configure Android PATH
        shell: bash
        run: |
          set -e

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi

          echo "Android PATH configured"


      # =========================
      # VERIFY SDK
      # =========================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Platform:"
          ls -lah "$ANDROID_HOME/platforms/android-35"

          echo "Build Tools:"
          ls -lah "$ANDROID_HOME/build-tools/35.0.0"

          echo "Platform Tools:"
          ls -lah "$ANDROID_HOME/platform-tools"

          echo "Android SDK verification successful"


      # =========================
      # GRADLE
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # =========================
      # CHECK PROJECT
      # =========================
      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          echo "Checking BLAY project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "BLAY project structure OK"


      # =========================
      # GRADLE VERSION
      # =========================
      - name: Show Gradle version
        run: |
          gradle --version


      # =========================
      # BUILD APK
      # =========================
      - name: Build BLAY Debug APK
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "BUILDING BLAY APK"
          echo "================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo "================================="
          echo "BLAY BUILD FINISHED"
          echo "================================="


      # =========================
      # VERIFY APK
      # =========================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Checking APK..."

          ls -lah app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "================================="
          echo "APK BERHASIL DIBUAT"
          echo "================================="
          ls -lh app/build/outputs/apk/debug/app-debug.apk


      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload BLAY APK
        uses: actions/upload-artifact@v4
        with:
          name: BLAY-v1.8-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
